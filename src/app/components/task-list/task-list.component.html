<section class="task-list">
  <h2>Suas tarefas</h2>

  <p *ngIf="tasks.length === 0">
    Nenhuma tarefa cadastrada.
  </p>

  <div class="task-grid" *ngIf="tasks.length > 0">
    <mat-card *ngFor="let task of tasks" class="task-card">
      <mat-card-header>
        <mat-card-title>{{ task.titulo }}</mat-card-title>
        <mat-card-subtitle>{{ task.status }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>{{ task.descricao }}</p>
        <span class="task-priority">
          Prioridade: {{ task.prioridade }}
        </span>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button (click)="onEditTask(task)">
          <mat-icon>edit</mat-icon>
          Editar
        </button>

        <button mat-button color="warn" (click)="onDeleteTask(task.id)">
          <mat-icon>delete</mat-icon>
          Excluir
        </button>
      </mat-card-actions>

      <div class="task-execution">
        <mat-checkbox #emailCheckbox>
          Enviar e-mail
        </mat-checkbox>

        <button
          mat-raised-button
          color="primary"
          [disabled]="task.status === Status.CONCLUIDA"
          (click)="onExecuteTask(task.id, emailCheckbox.checked)">
          <mat-icon>play_arrow</mat-icon>
          Executar
        </button>
      </div>
    </mat-card>
  </div>
</section>
