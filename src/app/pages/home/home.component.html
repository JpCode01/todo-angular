<h1>{{ pageTitle }}</h1>
<p>{{ description }}</p>

<button (click)="onCreateTask()" [disabled]="!canCreateTask">
    Realizar Transferência
</button>

<app-task-form 
[title]="formTitle"
[task]="selectedTask"
(taskSubmitted)="onTaskSubmitted($event)"
(taskUpdated)="onTaskUpdated($event)"
(taskCancelled)="onTaskCacelled()">
</app-task-form>

<app-task-list 
[tasks]="tasks" 
(taskDeleted)="onTaskDeleted($event)"
(taskSelected)="onTaskSelected($event)">
</app-task-list>
